name: collect-stock

# Post-close collection of stock reference info → POST to jarvis API.
# GitHub cron is UTC and best-effort (can be delayed) — fine for post-close,
# not for tight intraday. 09:43 UTC = 18:43 KST (after 투자자 flows settle).
on:
  schedule:
    - cron: '43 9 * * 1-5' # weekdays, 18:43 KST (off-minute to dodge on-the-hour delays)
    # Pre-market sweep, 08:10 KST weekdays (23:10 UTC the day before, so Sun-Thu).
    # Mostly a safety net: it re-posts the previous session if the close run failed,
    # and captures the morning 외국인 보유비율 as its own bucket.
    - cron: '10 23 * * 0-4'
    # Intraday sweep, hourly 09:00-15:00 KST weekdays (00:00-06:00 UTC). Stores a
    # separate intraday_price metric — never the daily bar, which isn't settled yet.
    - cron: '0 0-6 * * 1-5'
    # Closing price, 15:35 KST weekdays (06:35 UTC). The 15:00 sweep above used to be
    # the last one, and GitHub's delay pushed it past the old 15:30 collection cutoff —
    # so the closing price was never captured and the last observed price each day was
    # 40-60 min stale. This run lands inside the close-capture window and its snapshot
    # is pinned to the 15:00 bucket. The routine also triggers this on demand, which is
    # the reliable path; this cron is the safety net.
    - cron: '35 6 * * 1-5'
  workflow_dispatch: # manual trigger for testing / one-off backfills / routine dispatch
    inputs:
      backfill_days:
        description: 'Days of history to collect (0 = latest settled day only)'
        required: false
        default: '0'
      run_kind:
        description: 'Collection kind override (intraday|close|premarket). Empty = manual.'
        required: false
        default: ''

concurrency:
  group: collect-stock
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect
        run: pnpm exec tsx scripts/collect-stock.ts
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          # 공시 수집용. 없으면 수집기가 공시를 건너뛰고 뉴스 RSS만 모은다.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          JARVIS_API_TOKEN: ${{ secrets.JARVIS_API_TOKEN }}
          JARVIS_BASE_URL: ${{ secrets.JARVIS_BASE_URL }}
          # scheduled runs have no inputs → falls back to 0 (latest day only)
          STOCK_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          # which cron fired; empty for manual runs (the collector labels those itself)
          # priority: explicit dispatch input > schedule-derived > '' (manual)
          STOCK_RUN_KIND: ${{ github.event.inputs.run_kind || (github.event_name == 'schedule' && (github.event.schedule == '10 23 * * 0-4' && 'premarket' || (github.event.schedule == '0 0-6 * * 1-5' && 'intraday' || 'close')) || '') }}
