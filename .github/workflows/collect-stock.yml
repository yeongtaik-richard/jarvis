name: collect-stock

# Post-close collection of stock reference info → POST to jarvis API.
# GitHub cron is UTC and best-effort (can be delayed) — fine for post-close,
# not for tight intraday. 09:43 UTC = 18:43 KST (after 투자자 flows settle).
on:
  schedule:
    - cron: '43 9 * * 1-5' # weekdays, 18:43 KST (off-minute to dodge on-the-hour delays)
    # Pre-market sweep, 08:10 KST weekdays (23:10 UTC the day before, so Sun-Thu).
    # Mostly a safety net: it re-posts the previous session if the close run failed,
    # and captures the morning 외국인 보유비율 as its own bucket.
    - cron: '10 23 * * 0-4'
  workflow_dispatch: # manual trigger for testing / one-off backfills
    inputs:
      backfill_days:
        description: 'Days of history to collect (0 = latest settled day only)'
        required: false
        default: '0'

concurrency:
  group: collect-stock
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect
        run: pnpm exec tsx scripts/collect-stock.ts
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          JARVIS_API_TOKEN: ${{ secrets.JARVIS_API_TOKEN }}
          JARVIS_BASE_URL: ${{ secrets.JARVIS_BASE_URL }}
          # scheduled runs have no inputs → falls back to 0 (latest day only)
          STOCK_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          # which cron fired; empty for manual runs (the collector labels those itself)
          STOCK_RUN_KIND: ${{ github.event_name == 'schedule' && (github.event.schedule == '10 23 * * 0-4' && 'premarket' || 'close') || '' }}
