openapi: 3.1.0
info:
  title: Jarvis Memory API
  description: |
    개인 비서 Jarvis가 메모리(메모/일정/사실/관계/트리거)를 저장·검색·갱신·삭제하기 위한 API.
    저장은 append-only 모델이다. 모든 변경은 새 version을 만들어 thread를 이어간다.
    동일한 사실의 변화(예: 미팅 시간 변경)는 PATCH로 supersede되며, 이전 버전은 보존된다.

    분류 (kind):
    - event: 시점이 있는 사건/계획. status는 planned/actual/cancelled 중 하나.
    - fact: 정적 사실(예: 와이프 생일은 X). status=active.
    - relationship: 사람·대상 관계 정보(예: 와이프=한윤정). status=active.
    - trigger: 특정 시점이 오면 상기시켜야 할 메모(예: 준수 생일에 X 사기). status=active/resolved.

    시간:
    - start_time: 사건 시작/계획 시각 (모든 시점 메모의 기본)
    - end_time: 사건 종료 시각 (기간 이벤트)
    - actual_time: 실제로 발생한 시각 (계획 vs 실제 구분에 사용)
    - 모두 ISO 8601, 오프셋 필수.

    attributes(jsonb): 자유 형식 메타데이터. 예: { "recur_yearly": true, "hotel": "...", "birthday": "1981-08-03" }.

    /api/stock/*: 별도 기능 — SK하이닉스(000660) 매매 **참고정보** 애그리게이터.
    수집기가 저장한 수급·일봉·외국인보유 스냅샷을 읽고, 그 값에 근거한 브리핑을 남긴다.
    자동매매·수익예측이 아니다. 매수/매도/목표가/등급은 스키마에 없고, 검증되지 않은 방향성 주장은 API가 거부한다.
  version: '1.11.0'
servers:
  - url: https://jarvis-yeongtaik.vercel.app
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Memory:
      type: object
      description: 저장된 메모리의 한 version. is_canonical=true 이면 현재 유효한 버전.
      required:
        - id
        - thread_id
        - is_canonical
        - op
        - kind
        - status
        - title
        - importance
        - tags
        - source
        - time_precision
        - created_at
        - attributes
      properties:
        id:           { type: string, format: uuid }
        thread_id:    { type: string, format: uuid }
        supersedes_id: { type: [string, 'null'], format: uuid }
        is_canonical: { type: boolean }
        op:           { type: string, enum: [create, update, delete] }
        kind:         { type: string, enum: [event, fact, relationship, trigger] }
        status:       { type: string, enum: [planned, actual, cancelled, active, resolved, na] }
        title:        { type: string }
        body:         { type: [string, 'null'] }
        start_time:   { type: [string, 'null'], format: date-time, description: 사건 시작/계획 시각 }
        end_time:     { type: [string, 'null'], format: date-time, description: 사건 종료 시각 (기간 이벤트) }
        actual_time:  { type: [string, 'null'], format: date-time, description: 실제 발생 시각 }
        timezone:     { type: [string, 'null'], description: 사용자 의도의 타임존 (예 Asia/Seoul) }
        time_precision: { type: string, enum: [exact, date, month, unknown] }
        raw_time_text: { type: [string, 'null'] }
        importance:   { type: integer, enum: [0, 1, 2], description: "0=normal, 1=important(★), 2=pin(📌). 최댓값 2." }
        tags:         { type: array, items: { type: string } }
        attributes:   { type: object, description: 자유 형식 메타데이터(jsonb) }
        source:       { type: string, enum: [gpt, web, sync] }
        created_at:   { type: string, format: date-time }
        deleted_at:   { type: [string, 'null'], format: date-time }

    MemoryWithHistory:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          properties:
            history:
              type: array
              items: { $ref: '#/components/schemas/Memory' }

    CreateMemoryInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: 사용자가 기억해 달라고 한 핵심 한 줄.
        body:
          type: [string, 'null']
          maxLength: 8000
        kind:
          type: string
          enum: [event, fact, relationship, trigger]
          default: event
          description: |
            event: 시점이 있는 사건/계획.
            fact: 정적 사실(생년월일 등 변하지 않는 정보).
            relationship: 사람·대상 관계 (가족/지인 등록).
            trigger: 특정 시점에 상기해야 할 메모.
        status:
          type: string
          enum: [planned, actual, cancelled, active, resolved, na]
          default: na
          description: |
            event는 planned/actual/cancelled 중 하나.
            fact·relationship은 active.
            trigger는 active(대기) 또는 resolved(완료).
            나머지는 na.
        start_time:
          type: [string, 'null']
          format: date-time
          description: ISO 8601, 오프셋 필수. 시점 미정이면 null.
        end_time:
          type: [string, 'null']
          format: date-time
          description: 기간 이벤트의 종료 시각. 점 이벤트면 null.
        actual_time:
          type: [string, 'null']
          format: date-time
          description: 실제 발생 시각. 계획만 있을 때는 null.
        timezone:
          type: [string, 'null']
          description: 한국 사용자면 보통 Asia/Seoul.
        time_precision:
          type: string
          enum: [exact, date, month, unknown]
          default: exact
        raw_time_text:
          type: [string, 'null']
          description: 사용자가 시간을 말한 원문.
        importance:
          type: integer
          enum: [0, 1, 2]
          default: 0
          description: |
            중요도 단계. 0=보통(기본), 1=important(★), 2=pin(📌, 최상위 고정).
            상한은 2. 3 이상을 보내면 400 invalid_input.
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 60 }
          maxItems: 20
          default: []
          description: |
            표준 prefix 사용 권장:
            - family:wife, family:son:준수, family:son:준서
            - self
            - place:목포, trip:목포-2026-05
            - recur:birthday:준수, gift
        attributes:
          type: object
          default: {}
          description: |
            자유 형식 메타데이터(jsonb). 권장 키:
            - recur_yearly: boolean — 연간 반복 트리거 여부
            - birthday: "YYYY-MM-DD" — fact/relationship의 생년월일
            - hotel/place 등 도메인 정보
        source:
          type: string
          enum: [gpt, web, sync]
          default: gpt
        supersedes_id:
          type: [string, 'null']
          format: uuid
          description: 기존 메모리를 갱신할 때 그 version_id. 새 메모면 생략.

    PatchMemoryInput:
      description: 기존 메모리를 갱신(supersede). URL의 id가 supersedes_id로 사용된다.
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        body: { type: [string, 'null'], maxLength: 8000 }
        kind: { type: string, enum: [event, fact, relationship, trigger], default: event }
        status: { type: string, enum: [planned, actual, cancelled, active, resolved, na], default: na }
        start_time: { type: [string, 'null'], format: date-time }
        end_time: { type: [string, 'null'], format: date-time }
        actual_time: { type: [string, 'null'], format: date-time }
        timezone: { type: [string, 'null'] }
        time_precision: { type: string, enum: [exact, date, month, unknown], default: exact }
        raw_time_text: { type: [string, 'null'] }
        importance: { type: integer, enum: [0, 1, 2], default: 0, description: "0=normal, 1=important(★), 2=pin(📌). 상한 2." }
        tags: { type: array, items: { type: string }, default: [] }
        attributes: { type: object, default: {} }
        source: { type: string, enum: [gpt, web, sync], default: gpt }

    SearchResult:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Memory' } }
        count: { type: integer }

    Improvement:
      type: object
      description: 백엔드 한계나 부족한 기능을 자비스가 기록한 노트.
      required: [id, observed_request, missing_capability, priority, status, created_at]
      properties:
        id:                 { type: string, format: uuid }
        observed_request:   { type: string, description: 사용자가 무엇을 요청·기대했는지 }
        missing_capability: { type: string, description: 백엔드/스키마/API에서 무엇이 부족한지 }
        proposed_fix:       { type: [string, 'null'], description: 어떻게 고치면 될지 자비스 제안 }
        priority:           { type: integer, minimum: 0, maximum: 3 }
        status:             { type: string, enum: [open, triaged, applied, wontfix] }
        example_memory_id:  { type: [string, 'null'], format: uuid }
        created_at:         { type: string, format: date-time }
        resolved_at:        { type: [string, 'null'], format: date-time }
        resolution_note:    { type: [string, 'null'] }

    CreateImprovementInput:
      type: object
      required: [observed_request, missing_capability]
      properties:
        observed_request:   { type: string, minLength: 1, maxLength: 2000 }
        missing_capability: { type: string, minLength: 1, maxLength: 2000 }
        proposed_fix:       { type: [string, 'null'], maxLength: 4000 }
        priority:           { type: integer, minimum: 0, maximum: 3, default: 0 }
        example_memory_id:  { type: [string, 'null'], format: uuid }

    PatchImprovementInput:
      type: object
      properties:
        status: { type: string, enum: [open, triaged, applied, wontfix] }
        priority: { type: integer, minimum: 0, maximum: 3 }
        proposed_fix: { type: [string, 'null'], maxLength: 4000 }
        resolution_note: { type: [string, 'null'], maxLength: 4000 }

    ImprovementList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Improvement' } }
        count: { type: integer }

    StockSnapshot:
      type: object
      description: |
        수집기가 저장한 시장 참고정보 한 건. 자연키 (symbol, source, metric, bucket_key)로 upsert된다.
        지표별 스키마 차이는 전부 payload 안에만 있다.
      required: [id, symbol, source, metric, bucket_key, schema_version, captured_at, payload]
      properties:
        id:               { type: string, format: uuid }
        symbol:           { type: string, description: '종목코드 (예: 000660 = SK하이닉스)' }
        source:           { type: string, description: '데이터 출처 (kis 등)' }
        metric:
          type: string
          description: |
            지표 종류. payload 필드는 metric마다 다르다.
            - investor_flow: close, amount_unit='million_krw', {foreign,institution,individual}_{net,buy,sell}
              — 투자자별 매매**대금(백만원 단위)**. 순매수 = 매수 − 매도. 그대로 읽으면 조 단위를 오해하게 되니
              환산해서 말할 것 (1,000,000백만원 = 1조).
            - daily_ohlcv: open, high, low, close, volume — **확정된 일봉만** 저장된다(장중엔 안 쌓임)
            - foreign_holding: price, foreign_ratio(%), foreign_qty
            - intraday_price: price, change, change_rate, open, high, low, volume,
              amount_krw(**단위 원** — 수급의 백만원과 다르다), foreign_ratio, foreign_qty.
              장중(09~15시 KST) 매시 1건이고 bucket_key가 ISO 시각이다. 오늘 장중 얘기는 이걸 봐야 한다.
        bucket_key:       { type: string, description: '멱등 버킷. 일별은 YYYY-MM-DD, 인트라데이는 ISO 시각.' }
        schema_version:   { type: integer }
        trading_date_kst: { type: [string, 'null'], description: 'KRX 거래일 (YYYY-MM-DD)' }
        as_of_at:         { type: [string, 'null'], format: date-time, description: 데이터 기준 시각 }
        captured_at:      { type: string, format: date-time, description: 수집(저장) 시각. 데이터 시점이 아니라 기록 시점. }
        collector_run_id: { type: [string, 'null'], format: uuid, description: 한 번의 수집 실행을 묶는 id }
        payload_hash:     { type: [string, 'null'] }
        payload:          { type: object, description: 지표별 원천 값 (metric 설명 참조) }

    StockSnapshotList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StockSnapshot' } }
        count: { type: integer }

    CreateStockSnapshotInput:
      type: object
      description: 수집기 전용 입력. 실제 수집된 값만 넣는다.
      required: [symbol, source, metric, bucket_key, payload]
      properties:
        symbol:           { type: string, minLength: 1, maxLength: 20 }
        source:           { type: string, minLength: 1, maxLength: 20 }
        metric:           { type: string, minLength: 1, maxLength: 40 }
        bucket_key:       { type: string, minLength: 1, maxLength: 60, description: '일별 YYYY-MM-DD 또는 인트라데이 ISO. 같은 키 재전송은 덮어쓴다.' }
        schema_version:   { type: integer, minimum: 1, maximum: 1000, default: 1 }
        trading_date_kst: { type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$' }
        as_of_at:         { type: [string, 'null'], format: date-time }
        collector_run_id: { type: [string, 'null'], format: uuid }
        payload:          { type: object }

    StockAnalysis:
      type: object
      description: |
        스냅샷을 근거로 쓴 브리핑. **매수/매도/목표가/등급 필드는 설계상 존재하지 않는다** —
        이 API는 방향성 추천을 하지 않는다.
      required: [id, created_at, symbol, kind, claim_type, body, input_snapshot_ids, authored_by]
      properties:
        id:         { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        symbol:     { type: string }
        kind:       { type: string, enum: [pre, intraday, close, ondemand] }
        claim_type: { type: string, enum: [state_summary, anomaly, scenario, risk, validated_directional] }
        title:      { type: [string, 'null'] }
        body:       { type: string }
        input_snapshot_ids:
          type: array
          items: { type: string, format: uuid }
          description: 이 브리핑이 근거로 삼은 snapshot id 목록
        prompt_version: { type: [string, 'null'] }
        authored_by:    { type: string }

    StockAnalysisList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StockAnalysis' } }
        count: { type: integer }

    CreateStockAnalysisInput:
      type: object
      required: [body]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 20, default: '000660' }
        kind:
          type: string
          enum: [pre, intraday, close, ondemand]
          default: ondemand
          description: 'pre=장 시작 전, intraday=장중, close=마감 후, ondemand=사용자 요청 시'
        claim_type:
          type: string
          enum: [state_summary, anomaly, scenario, risk]
          default: state_summary
          description: |
            state_summary: 현재 수급·가격 상태 요약 (기본).
            anomaly: 평소 대비 튀는 값 지적.
            scenario: 조건부 시나리오 ("X가 나오면 Y 국면").
            risk: 지켜봐야 할 리스크.
            validated_directional은 적중률 검증 통계가 붙기 전까지 **400으로 거부**된다.
        title: { type: [string, 'null'], maxLength: 200 }
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: 브리핑 본문. 스냅샷에서 실제로 읽은 값에 근거해야 하며, 매수/매도 권유는 쓰지 않는다.
        input_snapshot_ids:
          type: array
          items: { type: string, format: uuid }
          maxItems: 50
          default: []
          description: 근거로 삼은 snapshot id. getStockSnapshots 응답의 id를 그대로 넣는다.
        prompt_version: { type: [string, 'null'], maxLength: 40 }
        authored_by: { type: string, maxLength: 40, default: claude-session }

    CollectorRun:
      type: object
      description: 수집기 한 번의 실행 기록. id는 그 실행이 남긴 스냅샷의 collector_run_id와 같다.
      required: [id, symbol, kind, status, started_at, posted, failed]
      properties:
        id:          { type: string, format: uuid }
        symbol:      { type: string }
        kind:        { type: string, enum: [close, premarket, intraday, backfill, manual] }
        status:      { type: string, enum: [running, ok, partial, error] }
        started_at:  { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        posted:      { type: integer, description: 성공적으로 저장된 스냅샷 수 }
        failed:      { type: integer }
        error:       { type: [string, 'null'] }

    CollectorRunList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CollectorRun' } }
        count: { type: integer }

    CollectorHealth:
      type: object
      description: 수집이 살아있는지 한 번에 보는 요약.
      required: [missed, latest_snapshots]
      properties:
        last_run:    { oneOf: [{ $ref: '#/components/schemas/CollectorRun' }, { type: 'null' }] }
        last_ok_run: { oneOf: [{ $ref: '#/components/schemas/CollectorRun' }, { type: 'null' }] }
        expected_close_run_at:
          type: [string, 'null']
          format: date-time
          description: 이미 지났어야 할 가장 최근 마감 수집 시각(유예 45분 포함).
        missed:
          type: boolean
          description: |
            true면 기대 시각까지 성공한 수집이 없다.
            **단 KRX 공휴일에는 오탐이다** — 스케줄이 휴장일을 모른다. 사용자에게 알릴 땐 이 단서를 같이 말할 것.
        hours_since_ok: { type: [number, 'null'] }
        latest_snapshots:
          type: array
          description: 지표별 가장 최근 거래일 스냅샷
          items:
            type: object
            properties:
              metric:      { type: string }
              bucket_key:  { type: string }
              captured_at: { type: string, format: date-time }

    TradeDecision:
      type: object
      description: |
        **사용자가 실제로 한 매매 결정의 기록**과 그 뒤에 붙인 결과·교훈.
        AI의 추천이 아니다 — action은 이미 일어난 일을 받아적은 값이다.
      required: [id, symbol, decided_at, action, rationale, status, created_at]
      properties:
        id:         { type: string, format: uuid }
        symbol:     { type: string }
        decided_at: { type: string, format: date-time }
        action:     { type: string, enum: [buy, sell, hold, watch, skip] }
        price:      { type: [integer, 'null'], description: 체결/기준가 (원) }
        quantity:   { type: [integer, 'null'] }
        rationale:  { type: string, description: 결정 시점의 근거 }
        input_snapshot_ids: { type: array, items: { type: string, format: uuid } }
        analysis_id: { type: [string, 'null'], format: uuid }
        status:     { type: string, enum: [open, closed] }
        outcome_at: { type: [string, 'null'], format: date-time }
        outcome:    { type: [string, 'null'], description: 실제로 어떻게 됐나 }
        lesson:     { type: [string, 'null'], description: 다음에 뭘 다르게 할까 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TradeDecisionList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TradeDecision' } }
        count: { type: integer }

    CreateTradeDecisionInput:
      type: object
      required: [action, rationale]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 20, default: '000660' }
        decided_at:
          type: [string, 'null']
          format: date-time
          description: 생략하면 지금. 과거 결정을 뒤늦게 기록할 때만 채운다.
        action:
          type: string
          enum: [buy, sell, hold, watch, skip]
          description: 사용자가 **실제로 한** 행동. 추천하려고 만들어 넣지 말 것.
        price: { type: [integer, 'null'], minimum: 0 }
        quantity: { type: [integer, 'null'], minimum: 0 }
        rationale:
          type: string
          minLength: 1
          maxLength: 4000
          description: 사용자가 말한 근거를 그대로. 없으면 되묻고, 지어내지 말 것.
        input_snapshot_ids: { type: array, items: { type: string, format: uuid }, maxItems: 50, default: [] }
        analysis_id: { type: [string, 'null'], format: uuid, description: 참고한 브리핑 id }

    PatchTradeDecisionInput:
      type: object
      description: 결과·교훈을 붙여 루프를 닫는다. outcome이나 lesson이 들어오면 status는 closed가 된다.
      properties:
        status:  { type: string, enum: [open, closed] }
        outcome: { type: [string, 'null'], maxLength: 4000 }
        lesson:  { type: [string, 'null'], maxLength: 4000 }
        outcome_at: { type: [string, 'null'], format: date-time }

    MarketEvent:
      type: object
      description: |
        공시(DART) 또는 뉴스 헤드라인 한 건. **사실만 담는다** — 호재/악재 판정이나
        인과 해석은 저장하지 않고, 그런 라벨을 만들어 붙여서도 안 된다.
      required: [id, symbol, source, external_id, published_at, title]
      properties:
        id:          { type: string, format: uuid }
        symbol:      { type: string }
        source:      { type: string, enum: [dart, news] }
        external_id: { type: string, description: '멱등 키 — 공시 rcept_no, 뉴스는 링크 해시' }
        published_at:
          type: string
          format: date-time
          description: |
            발행 시각. **공시(dart)는 DART가 날짜만 주므로 09:00 KST 근사값이다** —
            공시로 장중 분 단위 대조를 하지 말 것. 시각이 정확한 건 뉴스(news)뿐이다.
        title:     { type: string }
        url:       { type: [string, 'null'] }
        publisher: { type: [string, 'null'], description: '공시는 제출인, 뉴스는 언론사' }
        category:  { type: [string, 'null'], description: "'macro'면 종목 무관 매크로 뉴스(엔캐리·환율 개입 등)" }
        collected_at: { type: string, format: date-time }

    MarketEventList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketEvent' } }
        count: { type: integer }

    StockRegime:
      type: object
      description: |
        저장된 일봉·수급으로 **매번 계산하는** 지표와 규칙 기반 국면 라벨. 저장된 값이 아니다.
        **예측이 아니라 과거 데이터의 서술이다** — "하락 추세"는 지금까지 내려왔다는 뜻이고
        앞으로 내려간다는 뜻이 아니다. 이 값을 근거로 매수/매도를 권하지 말 것.
      properties:
        symbol: { type: string }
        indicators:
          type: [object, 'null']
          description: |
            표본이 창 길이보다 짧으면 해당 값은 null이다 (MA20을 5일로 계산해 MA20이라
            부르지 않기 위해). null을 0으로 읽지 말 것.
          properties:
            trading_days: { type: integer }
            as_of:        { type: string, description: 계산 기준 거래일 }
            close:        { type: number }
            ma5:   { type: [number, 'null'] }
            ma20:  { type: [number, 'null'] }
            ma60:  { type: [number, 'null'] }
            ma120: { type: [number, 'null'] }
            dist_ma20_pct:  { type: [number, 'null'], description: 종가의 MA20 대비 이격(%) }
            dist_ma60_pct:  { type: [number, 'null'] }
            dist_ma120_pct: { type: [number, 'null'] }
            peak_250:     { type: [number, 'null'] }
            drawdown_pct: { type: [number, 'null'], description: 250일 고점 대비 (%) }
            consecutive_down_days: { type: integer }
            consecutive_up_days:   { type: integer }
            vol20_pct:        { type: [number, 'null'], description: 20일 실현변동성(일간 표준편차 %) }
            vol20_percentile: { type: [number, 'null'], description: 보유 이력 분포에서의 백분위 }
            volume_ratio:     { type: [number, 'null'], description: 최근 5일 평균 거래량 / 60일 평균 }
            foreign_net_20d:     { type: [number, 'null'], description: '외국인 20일 누적 순매수 **대금(백만원)**' }
            institution_net_20d: { type: [number, 'null'] }
            individual_net_20d:  { type: [number, 'null'] }
            foreign_streak_days: { type: integer, description: '같은 방향 연속 거래일. 양수=순매수, 음수=순매도' }
            fx:
              type: array
              description: |
                환율 변화율 (매크로 지표 — 벤치마크 아님). **USD/JPY 하락 = 엔 강세**이며
                엔캐리 청산 압력은 엔 강세 쪽에서 커진다. reading 필드의 해석 문구를 그대로 쓸 것.
              items:
                type: object
                properties:
                  key:   { type: string }
                  label: { type: string }
                  close: { type: number }
                  as_of: { type: string }
                  chg_1d_pct:  { type: [number, 'null'] }
                  chg_5d_pct:  { type: [number, 'null'] }
                  chg_20d_pct: { type: [number, 'null'] }
                  reading: { type: [string, 'null'] }
        regime:
          type: [object, 'null']
          properties:
            trend:      { type: string, enum: [up, down, sideways, unknown] }
            volatility: { type: string, enum: [calm, normal, elevated, extreme, unknown] }
            flow:       { type: string, enum: [foreign_buying, foreign_selling, mixed, unknown] }
            label:      { type: string, description: 사람이 읽는 한 줄 요약 }
            reasons:
              type: array
              items: { type: string }
              description: 각 판정의 근거 숫자. 브리핑에 쓸 때 라벨만 옮기지 말고 이 숫자를 함께 인용할 것.
            disclaimer: { type: string }

    Prediction:
      type: object
      description: |
        브리핑의 "지켜볼 것"을 기계가 채점 가능한 조건으로 기록한 것. **추천이 아니라 채점될 기록**이다.
        데이터가 도착하면 결정론적으로 confirmed/refuted가 갈리고, 3일 유예 내 데이터가 안 오면 expired.
      required: [id, symbol, claim, metric, field, comparator, threshold, target_bucket, status]
      properties:
        id:            { type: string, format: uuid }
        symbol:        { type: string }
        created_at:    { type: string, format: date-time }
        analysis_id:   { type: [string, 'null'], format: uuid, description: 이 예측을 낳은 브리핑 }
        authored_by:   { type: string }
        kind:          { type: string, enum: [watch, directional], description: 'directional은 아직 쓰지 않는다 (§정직성)' }
        claim:         { type: string, description: 사람이 읽는 문장 }
        metric:        { type: string, description: 채점에 쓸 stock_snapshots.metric }
        field:         { type: string, description: payload 내 숫자 필드 }
        comparator:    { type: string, enum: [gt, gte, lt, lte] }
        threshold:     { type: number }
        target_bucket: { type: string, description: '채점 대상 bucket_key (일별 YYYY-MM-DD)' }
        status:        { type: string, enum: [pending, confirmed, refuted, expired, unverifiable] }
        actual_value:  { type: [number, 'null'] }
        scored_at:     { type: [string, 'null'], format: date-time }
        score_note:    { type: [string, 'null'] }

    PredictionList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Prediction' } }
        count: { type: integer }

    PredictionStats:
      type: object
      description: 적중률 요약. hit_rate만 인용하지 말고 반드시 scored(표본 수)와 함께 말할 것.
      properties:
        symbol:    { type: string }
        total:     { type: integer }
        pending:   { type: integer }
        confirmed: { type: integer }
        refuted:   { type: integer }
        expired:   { type: integer }
        unverifiable: { type: integer }
        scored:    { type: integer, description: confirmed + refuted }
        hit_rate:  { type: [number, 'null'], description: 'confirmed / scored. 표본이 없으면 null' }
        by_author:
          type: array
          items:
            type: object
            properties:
              authored_by: { type: string }
              confirmed:   { type: integer }
              refuted:     { type: integer }
              hit_rate:    { type: [number, 'null'] }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { description: 추가 정보 (검증 오류 등). 형태는 다양함. }

  responses:
    BadRequest:
      description: 잘못된 입력
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: 인증 실패
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: 존재하지 않는 리소스
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: 이미 supersede되었거나 canonical이 아닌 항목 등 충돌 상태
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

security:
  - bearerAuth: []

paths:
  /api/memory:
    get:
      operationId: searchMemory
      x-openai-isConsequential: false
      summary: 메모리 검색·목록
      description: |
        키워드, 기간, 태그, kind/status, 월-일로 메모리를 검색한다.
        기본은 현재 유효한(is_canonical=true, deleted=false) 항목만 반환.
        정렬: (시간 보유 그룹 위) → 중요도 → coalesce(actual_time, start_time, created_at) 역순.
      parameters:
        - { name: q,          in: query, schema: { type: string, maxLength: 200 } }
        - { name: from,       in: query, schema: { type: string, format: date-time } }
        - { name: to,         in: query, schema: { type: string, format: date-time } }
        - { name: tag,        in: query, schema: { type: string } }
        - { name: kind,       in: query, schema: { type: string, enum: [event, fact, relationship, trigger] } }
        - { name: status,     in: query, schema: { type: string, enum: [planned, actual, cancelled, active, resolved, na] } }
        - name: on_month_day
          in: query
          description: 'MM-DD 형식. 매년 반복되는 사건 검색 (예: 09-28).'
          schema: { type: string, pattern: '^(0?[1-9]|1[0-2])-(0?[1-9]|[12]\d|3[01])$' }
        - { name: limit,      in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: include_history
          in: query
          description: |
            true면 supersede된 옛 version도 포함 (계획 → 실제 → 취소 같은 thread 안의 변천사를 모두 보여줌).
            회상/요약 질의에는 보통 true로 호출해 plan과 actual을 둘 다 끌어올 것.
          schema: { type: boolean, default: false }
        - name: include_deleted
          in: query
          description: |
            기본은 false — 사용자가 명시적으로 "지워/삭제"라고 했던 thread는 모두 결과에서 제외된다.
            "내가 지웠던 거 뭐였지?" 같이 사용자가 명시적으로 삭제 이력을 묻는 경우에만 true로 호출.
            status='cancelled' 같은 계획 변경은 이 필터와 무관 (include_history=true로 보임).
          schema: { type: boolean, default: false }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: createMemory
      x-openai-isConsequential: false
      summary: 새 메모리 저장 또는 supersede
      description: |
        사용자가 기억해 달라고 한 내용을 저장한다. 분류 규칙(kind/status)·시간 처리·계획→실제 supersede 흐름은
        시스템 instructions 참조. 시점 모호하면 추정 말고 재질문, 정말 모르면 start_time=null+time_precision=unknown.
        기존 메모 갱신 의도면 supersedes_id에 version_id를 넣음.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMemoryInput' } } }
      responses:
        '201': { description: 생성된 version, content: { application/json: { schema: { $ref: '#/components/schemas/Memory' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/memory/{id}:
    get:
      operationId: getMemory
      x-openai-isConsequential: false
      summary: 단건 조회 (선택적 thread 이력 포함)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: include_history, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Memory'
                  - $ref: '#/components/schemas/MemoryWithHistory'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      operationId: supersedeMemory
      x-openai-isConsequential: false
      summary: 기존 메모리를 새 버전으로 갱신
      description: |
        URL의 id를 supersedes_id로 삼아 새 version을 만든다.
        이전 version은 is_canonical=false로 보존된다 (이력 추적 가능).
        호출 전 반드시 searchMemory로 대상 version_id를 확보할 것.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchMemoryInput' } } }
      responses:
        '201': { description: 새 canonical version, content: { application/json: { schema: { $ref: '#/components/schemas/Memory' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

    delete:
      operationId: deleteMemory
      x-openai-isConsequential: true
      summary: 메모리 soft delete (tombstone 추가)
      description: |
        사용자가 명시적으로 "지워" "삭제" "잊어버려"라고 한 경우에만 호출.
        모호한 표현은 supersede(상태 변경)로 처리할 것.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: tombstone version, content: { application/json: { schema: { $ref: '#/components/schemas/Memory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/triggers/due:
    get:
      operationId: listTriggersDue
      x-openai-isConsequential: false
      summary: 오늘(혹은 지정일) 상기시켜야 할 트리거 목록
      description: |
        kind=trigger AND status=active 중에서, attributes.recur_yearly=true면 month-day 매칭,
        아니면 start_time::date 정확 매칭.
        대화 시작 시 또는 "오늘 일정" 류 질의 시 함께 호출해 컨텍스트로 활용.
      parameters:
        - { name: date, in: query, description: 'YYYY-MM-DD. 미지정 시 오늘.', schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/calendar/resync:
    get:
      operationId: listCalendarSyncFailures
      x-openai-isConsequential: false
      summary: 캘린더 동기화 실패한 thread 목록
      description: |
        sync_state가 pending 또는 error인 event_thread를 모두 반환.
        실패 사유는 동시에 /api/improvement(category=sync_failure)에 기록되어 있음.
      responses:
        '200':
          description: 결과 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        thread_id: { type: string, format: uuid }
                        sync_state: { type: string }
                        google_event_id: { type: [string, 'null'] }
                        last_synced_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: resyncCalendar
      x-openai-isConsequential: true
      summary: 캘린더 동기화 실패한 thread 모두 재시도
      description: |
        sync_state in (pending, error)인 모든 thread를 한 번에 재동기화.
        성공한 thread는 sync_state=synced로 업데이트.
        사용자가 명시적으로 "캘린더 동기화 다시 해줘" 등의 요청을 했을 때만 호출할 것.
      responses:
        '200':
          description: 재동기화 결과
          content:
            application/json:
              schema:
                type: object
                required: [attempted, synced, failed, thread_ids]
                properties:
                  attempted: { type: integer }
                  synced: { type: integer }
                  failed: { type: integer }
                  thread_ids:
                    type: array
                    items:
                      type: object
                      properties:
                        thread_id: { type: string, format: uuid }
                        sync_state: { type: string }
                        google_event_id: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/improvement:
    post:
      operationId: logImprovement
      x-openai-isConsequential: false
      summary: 자비스가 발견한 백엔드 한계 기록
      description: |
        다음 같은 케이스에서 호출:
        - 사용자 요청을 현재 스키마/API로 정확히 표현하지 못함
        - 검색 결과가 자주 빗나감
        - 새 분류·필드가 필요해 보임
        observed_request에 사용자가 뭘 말했는지, missing_capability에 뭐가 막혔는지,
        proposed_fix에 어떻게 고치면 될지 자유 서술.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateImprovementInput' } } }
      responses:
        '201': { description: 생성된 노트, content: { application/json: { schema: { $ref: '#/components/schemas/Improvement' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listImprovements
      x-openai-isConsequential: false
      summary: 개선 노트 목록
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, triaged, applied, wontfix] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/ImprovementList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/improvement/{id}:
