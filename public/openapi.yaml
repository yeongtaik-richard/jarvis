  /api/stock/snapshot:
    get:
      operationId: getStockSnapshots
      x-openai-isConsequential: false
      summary: 수집된 시장 참고정보 조회
      description: |
        SK하이닉스(000660) 수급·일봉·외국인보유 스냅샷을 읽는다. 주가/수급 질문에 답하기 전에 먼저 호출할 것.
        - 지금 상태만 필요하면 latest=true (지표별 최신 1건).
        - 추세·비교가 필요하면 latest 생략 + metric 지정 + limit으로 과거 일자를 함께 받는다
          (일자는 bucket_key/trading_date_kst, 정렬은 captured_at 역순).
        수치를 말할 때 investor_flow 금액은 백만원 단위임을 반드시 환산할 것.
        여기 없는 값(목표가, 컨센서스, 실시간 호가 등)은 추측하지 말고 없다고 답한다.
      parameters:
        - { name: symbol, in: query, description: '기본은 전체. 보통 000660.', schema: { type: string } }
        - name: metric
          in: query
          description: 'investor_flow | daily_ohlcv | foreign_holding'
          schema: { type: string }
        - { name: source, in: query, schema: { type: string } }
        - name: latest
          in: query
          description: 'true면 (symbol, metric)별 최신 1건만 반환.'
          schema: { type: boolean, default: false }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/StockSnapshotList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: createStockSnapshot
      x-openai-isConsequential: true
      summary: 스냅샷 upsert (수집기 전용)
      description: |
        **수집기(GitHub Actions의 collect-stock)만 호출한다.** 대화 중에는 호출하지 말 것 —
        시장 데이터를 모델이 만들어 넣으면 대시보드가 오염된다.
        자연키 (symbol, source, metric, bucket_key)로 upsert되므로 재전송은 멱등하다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockSnapshotInput' } } }
      responses:
        '201': { description: 저장된 스냅샷, content: { application/json: { schema: { $ref: '#/components/schemas/StockSnapshot' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/analysis:
    get:
      operationId: getStockAnalyses
      x-openai-isConsequential: false
      summary: 최근 브리핑 목록
      description: 최신순. 같은 얘기를 반복하지 않도록 새 브리핑을 쓰기 전에 확인할 것.
      parameters:
        - { name: symbol, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [pre, intraday, close, ondemand] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/StockAnalysisList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: createStockAnalysis
      x-openai-isConsequential: false
      summary: 브리핑 저장 (/stock 대시보드에 표시됨)
      description: |
        사용자가 브리핑을 요청했을 때, 먼저 getStockSnapshots로 실제 값을 읽고 그 값에 근거해 작성한다.
        input_snapshot_ids에 근거 스냅샷 id를 넣을 것.
        허용 범위는 현황 요약·이상치·조건부 시나리오·리스크까지다. **매수/매도/목표가/등급은 쓰지 않는다** —
        claim_type=validated_directional은 적중률 검증이 붙기 전까지 400으로 거부된다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStockAnalysisInput' } } }
      responses:
        '201': { description: 저장된 브리핑, content: { application/json: { schema: { $ref: '#/components/schemas/StockAnalysis' } } } }
        '400': { description: '검증 실패 (validated_directional 포함)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/health:
    get:
