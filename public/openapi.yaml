        missed=true면 마감 수집이 예정 시각까지 성공하지 못한 것 —
        **KRX 공휴일이면 정상**이라는 단서를 반드시 함께 말할 것 (스케줄은 휴장일을 모른다).
      parameters:
        - { name: symbol, in: query, schema: { type: string, default: '000660' } }
      responses:
        '200': { description: 수집 상태, content: { application/json: { schema: { $ref: '#/components/schemas/CollectorHealth' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/collector-run:
    get:
      operationId: getCollectorRuns
      x-openai-isConsequential: false
      summary: 수집기 실행 이력
      description: 언제 돌았고 몇 건 저장했는지. 실패 원인은 error 필드에 있다.
      parameters:
        - { name: symbol, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [running, ok, partial, error] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/CollectorRunList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/regime:
    get:
      operationId: getStockRegime
      x-openai-isConsequential: false
      summary: 지표·국면 (규칙 기반, 예측 아님)
      description: |
        "지금 상승장이야 하락장이야" 류 질문에 이걸로 답한다. 이동평균 이격, 250일 고점 대비 낙폭,
        20일 변동성의 이력 백분위, 수급 연속성을 계산해 규칙으로 국면을 분류한 결과다.
        - **예측이 아니다.** 라벨은 과거 데이터의 서술이며, 이걸 근거로 매수/매도를 권하면 안 된다.
        - `reasons`의 숫자를 함께 인용할 것. 라벨만 옮기면 근거 없는 단정이 된다.
        - `indicators`의 null은 **표본 부족**이라는 뜻이다. 0으로 읽지 말 것.
      parameters:
        - { name: symbol, in: query, schema: { type: string, default: '000660' } }
        - name: days
          in: query
          description: 계산에 쓸 최대 거래일 수 (20~1000, 기본 300)
          schema: { type: integer, minimum: 20, maximum: 1000, default: 300 }
      responses:
        '200': { description: 지표와 국면, content: { application/json: { schema: { $ref: '#/components/schemas/StockRegime' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/event:
    get:
      operationId: getMarketEvents
      x-openai-isConsequential: false
      summary: 공시·뉴스 조회
      description: |
        가격이 크게 움직인 이유를 찾을 때 호출한다. 급변 구간과 이벤트 시각을 나란히 놓는 것까지가
        이 데이터의 역할이다.
        - `since`로 특정 시각 이후만 좁힐 수 있다 (장중 급변 구간 대조).
        - **공시의 시각은 09:00 KST 근사**다(DART가 날짜만 준다). 분 단위 대조는 뉴스만 유효하다.
        - 뉴스에는 채용·일반 기사가 섞여 있다. 제목을 보고 관련성을 판단할 것.
        읽은 헤드라인을 근거로 "이 뉴스 때문에 올랐다/내렸다"고 단정하지 말 것 — 사건의 존재와
        시각만 사실이고, 인과는 검증되지 않았다.
      parameters:
        - { name: symbol, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [dart, news] } }
        - { name: since, in: query, description: '이 시각 이후 발행분만', schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/MarketEventList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/prediction:
    post:
      operationId: createStockPrediction
      x-openai-isConsequential: false
      summary: 채점 가능한 관찰 조건 등록
      description: |
        브리핑에 "지켜볼 것"을 쓸 때, 기계가 채점할 수 있는 항목이면 여기에도 구조화해 등록한다.
        예: "내일 수급에서 외국인 순매도가 이어지는지" →
        {metric: investor_flow, field: foreign_net, comparator: lt, threshold: 0, target_bucket: 내일 날짜}.
        - **대상 버킷의 데이터가 이미 있으면 409로 거부된다** — 결과가 나온 뒤의 등록은 예측이 아니다.
        - kind는 watch만 쓴다. directional은 적중률 통계가 쌓이기 전까지 금지다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Prediction' } } }
      responses:
        '201': { description: 등록됨, content: { application/json: { schema: { $ref: '#/components/schemas/Prediction' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 대상 버킷 데이터가 이미 존재 (사후 예측), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: getStockPredictions
      x-openai-isConsequential: false
      summary: 예측 목록 (조회가 곧 채점)
      description: pending 중 데이터가 도착한 것은 이 호출 시점에 자동 채점된다.
      parameters:
        - { name: symbol, in: query, schema: { type: string, default: '000660' } }
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, refuted, expired, unverifiable] } }
        - { name: authored_by, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/PredictionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/prediction/stats:
    get:
      operationId: getStockPredictionStats
      x-openai-isConsequential: false
      summary: 예측 적중률 요약
      description: hit_rate를 인용할 땐 반드시 scored(표본 수)를 함께 말할 것. 표본 몇 건짜리 적중률은 의미가 없다.
      parameters:
        - { name: symbol, in: query, schema: { type: string, default: '000660' } }
      responses:
        '200': { description: 통계, content: { application/json: { schema: { $ref: '#/components/schemas/PredictionStats' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/signal:
    get:
      operationId: getStockSignal
      x-openai-isConsequential: false
      summary: 규칙 기반 방향성 신호 (미검증 — 매매 지시 아님)
      description: |
        추세·수급·SOX 상대강도 3개 컴포넌트(각 ±1)의 합으로 buy/sell/watch를 내는 **결정론적 규칙**이다.
        변동성 극단(이력 90%ile 이상) 구간에서는 만점이 아니면 watch로 강등된다.
        - **미검증 신호다.** 인용할 때 반드시 directional 적중률(표본 수 포함)과 disclaimer를 함께 전달하라.
        - 사용자에게 "사라/팔라"로 번역하지 마라. "규칙 신호는 X, 단 미검증(표본 N)"이 정직한 전달이다.
        - 신호는 마감 후 자동으로 directional 예측(5거래일 지평)으로 기록돼 채점된다.
      parameters:
        - { name: symbol, in: query, schema: { type: string, default: '000660' } }
      responses:
        '200':
          description: 신호와 근거, directional 적중률
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: { type: string }
                  as_of: { type: [string, 'null'], description: 기준 종가의 거래일 }
                  reference_close: { type: [number, 'null'] }
                  signal:
                    type: [object, 'null']
                    properties:
                      signal: { type: string, enum: [buy, sell, watch] }
                      score: { type: integer }
                      max_score: { type: integer }
                      components:
                        type: array
                        items:
                          type: object
                          properties:
                            key: { type: string }
                            value: { type: integer }
                            reason: { type: string }
                      gated_by_volatility: { type: boolean }
                      disclaimer: { type: string }
                  target:
                    type: [object, 'null']
                    properties:
                      bucket: { type: string }
                      comparator: { type: [string, 'null'] }
                  directional:
                    type: object
                    description: 규칙 신호의 실전 적중률. hit_rate는 scored(표본)와 함께만 인용.
                    properties:
                      pending: { type: integer }
                      confirmed: { type: integer }
                      refuted: { type: integer }
                      scored: { type: integer }
                      hit_rate: { type: [number, 'null'] }
                  weekly:
                    type: array
                    description: 주 단위 등락 (마지막 확정 종가 기준, 최근 8주)
                    items:
                      type: object
                      properties:
                        week_start: { type: string }
                        close: { type: number }
                        chg_pct: { type: [number, 'null'] }
                  breakdown:
                    type: object
                    description: |
                      "어떤 장에서 어떤 규칙이 먹히나" — 국면별·컴포넌트별 성능 분해
                      (5거래일 지평, **게이트를 무시한 원시 방향** 기준).

                      인용 규칙: 각 줄의 hit_rate는 **그 슬라이스의** baseline_up_rate와
                      함께만 말할 것 — 국면마다 기저율이 다르므로(상승 추세 구간은 아무
                      날이나 사도 잘 맞는다) 기저율을 빼지 않으면 동어반복이 된다.
                      edge_pp가 그 뺄셈이다. n이 작은 줄과 수급 관련 줄은 특히 신뢰도가
                      낮다 — 수급 이력이 30거래일뿐이라 표본이 한 구간에 몰려 있고,
                      지평 창이 겹쳐 실질 독립 표본은 n보다 훨씬 적다. 전부 인샘플이므로
                      규칙 개선의 출발점이지 결론이 아니다.
                    properties:
                      regimes:
                        type: array
                        items:
                          type: object
                          properties:
                            axis: { type: string, enum: [trend, volatility, flow] }
                            value: { type: string }
                            n: { type: integer }
                            hits: { type: integer }
                            hit_rate: { type: [number, 'null'] }
                            baseline_up_rate: { type: [number, 'null'] }
                            edge_pp: { type: [number, 'null'] }
                      components:
                        type: array
                        items:
                          type: object
                          properties:
                            component: { type: string, enum: [trend, flow, relative_sox] }
                            n: { type: integer }
                            hits: { type: integer }
                            hit_rate: { type: [number, 'null'] }
                            baseline_up_rate: { type: [number, 'null'] }
                            edge_pp: { type: [number, 'null'] }
                  score_series:
                    type: array
                    description: 규칙 점수를 과거에 재적용한 시계열 (최근 90거래일)
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        score: { type: integer }
                        signal: { type: string, enum: [buy, sell, watch] }
                        gated: { type: boolean }
                  horizons:
                    type: array
                    description: |
                      **하루·일주일 두 지평.** 규칙도 점수도 하나이고, 다른 것은 "언제
                      확인하느냐"뿐이다. 각 지평은 인샘플 백테스트(backtest)와 실전
                      성적(live)을 따로 갖는다.

                      인용 규칙: backtest.buy.hit_rate는 **반드시**
                      backtest.baseline_up_rate(무작위 매수의 상승률)와 나란히 전달할 것.
                      둘의 차이가 규칙의 몫이고, 적중률 단독은 상승장 착시다. backtest는
                      인샘플(임계값을 이 데이터를 보며 정함)이므로 실전 성적이 아니다 —
                      live.scored가 쌓이기 전에는 "미검증"을 함께 말해야 한다.
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [d1, d5] }
                        label: { type: string }
                        trading_days: { type: integer }
                        target_bucket:
                          type: string
                          description: 채점될 거래일. 기준 봉(as_of)에서 잰다.
                        stale:
                          type: boolean
                          description: 대상 거래일이 이미 지났는가(기준 봉이 낡음). true면 기록하지 않는다.
                        backtest:
                          type: object
                          properties:
                            horizon_days: { type: integer }
                            buy:
                              type: object
                              properties:
                                n: { type: integer }
                                hits: { type: integer }
                                hit_rate: { type: [number, 'null'] }
                            sell:
                              type: object
                              properties:
                                n: { type: integer }
                                hits: { type: integer }
                                hit_rate: { type: [number, 'null'] }
                            baseline_up_rate: { type: [number, 'null'] }
                            note: { type: string }
                        live:
                          type: object
                          description: 통과한 신호의 실전 성적 — 이것이 규칙의 성적표다
                          properties:
                            pending: { type: integer }
                            confirmed: { type: integer }
                            refuted: { type: integer }
                            scored: { type: integer }
                            hit_rate: { type: [number, 'null'] }
                        blocked:
                          type: object
                          description: |
                            게이트·임계값에 **막힌** 날의 실전 성적. 매매 참고가 아니라
                            게이트 검증용 표본이다 — 이쪽이 live보다 잘 맞으면 게이트가
                            틀렸다는 증거다. 절대 매매 신호로 인용하지 말 것.
                          properties:
                            pending: { type: integer }
                            confirmed: { type: integer }
                            refuted: { type: integer }
                            scored: { type: integer }
                            hit_rate: { type: [number, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/decision:
    post:
      operationId: createTradeDecision
      x-openai-isConsequential: true
      summary: 사용자가 실제로 한 매매 결정을 기록
      description: |
        사용자가 "샀어 / 팔았어 / 그냥 뒀어 / 안 샀어" 같이 **이미 한 행동**을 말했을 때만 호출한다.
        이건 추천 기능이 아니다 — 무엇을 살지 제안하거나, 사용자가 말하지 않은 action을 추측해서 넣지 말 것.
        rationale에는 사용자가 말한 근거를 그대로 담고, 근거를 말하지 않았으면 되물을 것
        (나중에 결과와 대조하는 게 이 로그의 목적이라 사후 각색은 기록을 망친다).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTradeDecisionInput' } } }
      responses:
        '201': { description: 기록된 결정, content: { application/json: { schema: { $ref: '#/components/schemas/TradeDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: getTradeDecisions
      x-openai-isConsequential: false
      summary: 매매 결정 로그 목록
      description: |
        최신순. status=open이면 아직 결과를 안 적은 결정이다.
        "지난번에 왜 샀더라", "결과 안 적은 거 뭐 있지" 류 질문에 쓴다.
      parameters:
        - { name: symbol, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
        - { name: action, in: query, schema: { type: string, enum: [buy, sell, hold, watch, skip] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: 결과 목록, content: { application/json: { schema: { $ref: '#/components/schemas/TradeDecisionList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stock/decision/{id}:
    get:
      operationId: getTradeDecision
      x-openai-isConsequential: false
      summary: 결정 단건
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TradeDecision' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTradeDecision
      x-openai-isConsequential: true
      summary: 결과·교훈 붙이기 (루프 닫기)
      description: |
        사용자가 그 결정이 어떻게 됐는지 말했을 때 호출한다. outcome은 실제로 벌어진 일,
        lesson은 사용자가 스스로 내린 교훈이다. **AI가 대신 교훈을 지어내지 말 것** —
        사용자가 말한 것만 적는다.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchTradeDecisionInput' } } }
      responses:
        '200': { description: 갱신된 결정, content: { application/json: { schema: { $ref: '#/components/schemas/TradeDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
